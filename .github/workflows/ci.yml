name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck picdump.sh
      - name: Install ShellSpec
        run: |
          git clone --depth 1 https://github.com/shellspec/shellspec.git "$HOME/.shellspec"
          echo "$HOME/.shellspec" >> "$GITHUB_PATH"
      - name: Run tests
        run: shellspec
